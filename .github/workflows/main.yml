name: Main

on:
    workflow_dispatch:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [25.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            - run: npm ci

            - run: npm run ocr:assets:check

            - run: npm run test

            - name: Cache OCR models
              uses: actions/cache@v5
              with:
                  path: ~/.cache/lucrjournal-ocr-models
                  key: ocr-models-${{ runner.os }}-ppocr-v5-en-v1

            - run: npm run ocr:test:verify

            - run: npm run build:bundle

            - name: Lint and Knip
              run: npm run lint



    release:
        needs: verify
        if: github.event_name == 'push' && github.ref_name == 'main'
        runs-on: ubuntu-latest
        concurrency:
            group: release-${{ github.ref_name }}
            cancel-in-progress: false
        permissions:
            attestations: write
            artifact-metadata: write
            contents: write
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 25.x
                  cache: "npm"

            - name: Get version from package.json
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "Version from package.json: ${VERSION}"

            - name: Extract release notes from CHANGELOG.md
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  notes=$(awk -v ver="${VERSION}" '
                    /^## \[/ { if (found) exit; if ($0 ~ ("## \\[" ver "\\]")) found=1; next }
                    found { lines[++n] = $0 }
                    END {
                      while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
                      i = 1; while (i <= n && lines[i] ~ /^[[:space:]]*$/) i++
                      for (; i <= n; i++) print lines[i]
                    }
                  ' CHANGELOG.md)
                  if [ -z "$notes" ]; then
                    echo "Error: No release notes found for version ${VERSION} in CHANGELOG.md" >&2
                    exit 1
                  fi
                  echo "$notes" > /tmp/release_notes.md

            - name: Check if release exists
              id: check_release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                    echo "Release ${{ steps.version.outputs.version }} already exists, skipping release flow."
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "Release ${{ steps.version.outputs.version }} does not exist, starting release flow."
                  fi

            - name: Install dependencies
              if: steps.check_release.outputs.exists == 'false'
              run: npm ci

            - name: Build release files
              if: steps.check_release.outputs.exists == 'false'
              run: npm run build:bundle:prod

            - name: Prepare release artifacts
              if: steps.check_release.outputs.exists == 'false'
              run: |
                  mkdir -p dist/build
                  cp main.js dist/build/
                  cp manifest.json dist/build/
                  cp styles.css dist/build/
                  ls -R dist/build/

            - name: Upload build artifacts
              if: steps.check_release.outputs.exists == 'false'
              uses: actions/upload-artifact@v7
              with:
                  name: build-artifacts-${{ steps.version.outputs.version }}
                  path: dist/build/*

            - name: Attest build provenance
              if: steps.check_release.outputs.exists == 'false' && github.event.repository.private == false
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: dist/build/*

            - name: Skip build provenance attestation for non-public repositories
              if: steps.check_release.outputs.exists == 'false' && github.event.repository.private != false
              run: echo "Skipping build provenance attestation because this repository is not public."

            - name: Create release
              if: steps.check_release.outputs.exists == 'false'
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.version.outputs.version }}
                  name: Release ${{ steps.version.outputs.version }}
                  draft: false
                  prerelease: false
                  files: dist/build/*
                  body_path: /tmp/release_notes.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
