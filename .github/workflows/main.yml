name: Main

on:
    workflow_dispatch:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # @story [[lucrjournal/build#^public-repo-ci]] Gates public releases on the complete standalone verification sequence.
    verify:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - run: bun ci

            - run: bun run ocr:assets:check

            - run: bun run test

            - name: Cache OCR models
              uses: actions/cache@v5
              with:
                  path: ~/.cache/lucrjournal-ocr-models
                  key: ocr-models-${{ runner.os }}-ppocr-v5-en-v1

            - run: bun run ocr:test:verify

            - run: bun run build:bundle

            - name: Lint and Knip
              run: bun run lint

    release:
        needs: verify
        if: github.event_name == 'push' && github.ref_name == 'main'
        runs-on: ubuntu-latest
        concurrency:
            group: release-${{ github.ref_name }}
            cancel-in-progress: false
        permissions:
            attestations: write
            artifact-metadata: write
            contents: write
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Get version from package.json
              id: version
              run: |
                  VERSION=$(bun -p "require('./package.json').version")
                  IS_PRERELEASE=$(bun -p "Boolean(require('./package.json').version.includes('-'))")
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
                  echo "Version from package.json: ${VERSION} (prerelease: ${IS_PRERELEASE})"

            # @story [[lucrjournal/build#^release-changelog-required]] Fails before release lookup when the package version has no release notes.
            - name: Extract release notes from CHANGELOG.md
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  notes=$(awk -v ver="${VERSION}" '
                    /^## \[/ { if (found) exit; if ($0 ~ ("## \\[" ver "\\]")) found=1; next }
                    found { lines[++n] = $0 }
                    END {
                      while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
                      i = 1; while (i <= n && lines[i] ~ /^[[:space:]]*$/) i++
                      for (; i <= n; i++) print lines[i]
                    }
                  ' CHANGELOG.md)
                  if [ -z "$notes" ]; then
                    echo "Error: No release notes found for version ${VERSION} in CHANGELOG.md" >&2
                    exit 1
                  fi
                  echo "$notes" > /tmp/release_notes.md

            # @story [[lucrjournal/build#^release-create-once]] Skips every mutating release step when the package version already exists.
            - name: Check if release exists
              id: check_release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                    echo "Release ${{ steps.version.outputs.version }} already exists, skipping release flow."
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "Release ${{ steps.version.outputs.version }} does not exist, starting release flow."
                  fi

            - name: Install dependencies
              if: steps.check_release.outputs.exists == 'false'
              run: bun ci

            - name: Build release files
              if: steps.check_release.outputs.exists == 'false'
              run: bun run build:bundle:prod

            # @story [[lucrjournal/build#^release-files]] Copies only the three files consumed by Obsidian installation.
            - name: Prepare release artifacts
              if: steps.check_release.outputs.exists == 'false'
              run: |
                  mkdir -p dist/build
                  cp main.js dist/build/
                  cp manifest.json dist/build/
                  cp styles.css dist/build/
                  ls -R dist/build/

            - name: Upload build artifacts
              if: steps.check_release.outputs.exists == 'false'
              uses: actions/upload-artifact@v7
              with:
                  name: build-artifacts-${{ steps.version.outputs.version }}
                  path: |
                      dist/build/main.js
                      dist/build/manifest.json
                      dist/build/styles.css

            - name: Attest build provenance
              if: steps.check_release.outputs.exists == 'false' && github.event.repository.private == false
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      dist/build/main.js
                      dist/build/manifest.json
                      dist/build/styles.css

            - name: Skip build provenance attestation for non-public repositories
              if: steps.check_release.outputs.exists == 'false' && github.event.repository.private != false
              run: echo "Skipping build provenance attestation because this repository is not public."

            # @story [[lucrjournal/build#^release-create-once]] Uses the package version and extracted changelog for the new release.
            # @story [[lucrjournal/build#^release-files]] Publishes only the installable plugin file set.
            - name: Create release
              if: steps.check_release.outputs.exists == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
                  IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
              run: |
                  TITLE="Release ${VERSION}"
                  PRERELEASE_FLAG=()
                  if [ "$IS_PRERELEASE" = "true" ]; then
                    TITLE="Pre-release ${VERSION}"
                    PRERELEASE_FLAG=("--prerelease")
                  fi

                  gh release create "${VERSION}" \
                    dist/build/main.js \
                    dist/build/manifest.json \
                    dist/build/styles.css \
                    --title "${TITLE}" \
                    --notes-file /tmp/release_notes.md \
                    "${PRERELEASE_FLAG[@]}"
